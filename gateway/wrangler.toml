name = "nexusbridge-gateway"
main = "src/index.ts"
compatibility_date = "2024-11-12"

# After `npm run deploy` succeeds once, attach your custom domain in the
# Cloudflare dashboard (Workers → nexusbridge-gateway → Settings →
# Triggers → Custom Domains) and point it at:  gw.darkzhub.asia
# (the zone darkzhub.asia is already on Cloudflare, so no DNS setup needed).
#
# Until then the worker is reachable at:
#   https://nexusbridge-gateway.<your-subdomain>.workers.dev

# Upstream origin that all proxied traffic forwards to.
[vars]
ORIGIN = "https://sms2-api.darkzhub.asia"
